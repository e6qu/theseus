[package]
name = "theseus-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "The local Theseus test-manifest CLI"

[[bin]]
name = "theseus"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
toml = "1.1.3"

[dev-dependencies]
tempfile = "3.27.0"
