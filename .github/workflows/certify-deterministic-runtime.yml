name: certify deterministic runtime

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published 12-character SHA release tag to certify
        required: true
        type: string

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  resolve:
    name: resolve published SHA
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - id: release
        name: Verify the published release and runtime inputs
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/e6qu/theseus
          TAG: ${{ inputs.tag }}
        run: |
          printf '%s\n' "$TAG" | grep -E '^[0-9a-f]{12}$'
          release=$(mktemp -d)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish > "$release/release.json"
          test "$(jq -r .isDraft "$release/release.json")" = false
          commit=$(jq -r .targetCommitish "$release/release.json")
          printf '%s\n' "$commit" | grep -E '^[0-9a-f]{40}$'
          test "${commit::12}" = "$TAG"
          git merge-base --is-ancestor "$commit" origin/main
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "theseus-${TAG}-build-inputs.json" --dir "$release"
          inputs="$release/theseus-${TAG}-build-inputs.json"
          gh attestation verify "$inputs" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main
          test "$(jq -r .source.commit "$inputs")" = "$commit"
          test "$(jq -r .runtime.tag "$inputs")" = "$TAG"
          for arch in amd64 arm64; do
            gh attestation verify "oci://${IMAGE}:${TAG}-${arch}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main
          done
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  certify:
    name: certify (${{ matrix.arch }} KVM metal)
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: '["self-hosted","Linux","X64","kvm"]'
          - arch: arm64
            runner: '["self-hosted","Linux","ARM64","kvm"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Check native KVM and pull the exact runtime
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ghcr.io/e6qu/theseus
          TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse --short=12 HEAD)" = "$TAG"
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          kvm_api=$(python3 -c 'import fcntl, os; fd = os.open("/dev/kvm", os.O_RDWR); print(fcntl.ioctl(fd, 0xAE00, 0))')
          test "$kvm_api" = 12
          docker pull "$IMAGE:$TAG-$ARCH"
          test "$(docker image inspect "$IMAGE:$TAG-$ARCH" --format '{{.Architecture}}')" = "$ARCH"

      - name: Certify fixed-plan replay
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ghcr.io/e6qu/theseus
          TAG: ${{ inputs.tag }}
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE/docs/tutorials/11-certify-runtime":/tutorial \
            -w /tutorial "$IMAGE:$TAG-$ARCH" sh -ec '
              mkdir -p service/runtime service/guest/root/bin
              cp /usr/local/bin/firecracker service/runtime/firecracker
              cp /opt/theseus/vmlinux service/guest/vmlinux
              cp /bin/busybox service/guest/root/bin/busybox
              for applet in mount sleep poweroff; do
                ln -sf busybox "service/guest/root/bin/$applet"
              done
              cp service/init service/guest/root/init
              chmod +x service/guest/root/init
              (cd service/guest/root && find . -print | cpio -o -H newc --quiet | gzip > ../initramfs.cpio.gz)
              theseus compose plan > plan.json
              theseus-topology certify --plan plan.json --output certificate
              grep -F '"'"'"status"'"'": "'"'"passed"'"'"' certificate/certificate.json
            '
          cp docs/tutorials/11-certify-runtime/certificate/certificate.json \
            "theseus-${TAG}-runtime-certificate-${ARCH}.json"

      - name: Reproduce the distributed counterexample
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ghcr.io/e6qu/theseus
          TAG: ${{ inputs.tag }}
        run: |
          tutorial=docs/tutorials/30-multiservice-lost-update
          name=theseus-multiservice-lost-update
          mkdir -p "$tutorial/counter/work" "$tutorial/worker/work"
          docker build --load --platform "linux/$ARCH" -t "${name}-counter" "$tutorial/counter"
          docker build --load --platform "linux/$ARCH" -t "${name}-worker" "$tutorial/worker"
          docker save "${name}-counter" -o "$tutorial/counter/work/counter.tar"
          docker save "${name}-worker" -o "$tutorial/worker/work/worker.tar"
          docker run --rm --privileged --platform "linux/$ARCH" \
            -v "$GITHUB_WORKSPACE/$tutorial":/tutorial \
            -w /tutorial "$IMAGE:$TAG-$ARCH" sh -ec '
              for service in counter worker; do
                mkdir -p "$service/work/runtime" "$service/work/guest"
                cp /usr/local/bin/firecracker "$service/work/runtime/firecracker"
                cp /usr/local/bin/theseus-image "$service/work/runtime/theseus-image"
                cp /opt/theseus/vmlinux "$service/work/guest/vmlinux"
              done
              cp /opt/theseus/pivot.json runtime-pivot.json
              theseus compose plan > plan.json
              theseus compose explore \
                --expect-counterexample distributed_lost_update_is_unreachable \
                --output campaign compose.yaml
              theseus compose explore --minimize campaign \
                --expect-counterexample distributed_lost_update_is_unreachable \
                --output minimized
              theseus compose replay minimized --output rerun
              grep -R '"'"'"value"'"'":1' campaign/runs/*/services/counter/serial.log
              grep -R '"'"'"value"'"'":2' campaign/runs/*/services/counter/serial.log
              grep -F 'backplane:partition@setup' minimized/minimization.json
              grep -F 'backplane:heal@probe_partition' minimized/minimization.json
              grep -E '"'"'"dropped"'"'": [1-9][0-9]*' rerun/services/*/result.json
              grep -R '"'"'"network"'"'":"'"'"recovered"'"'"' rerun/services/writer-a/serial.log
              grep -F '"'"'"kind"'"'": "'"'"partition"'"'"' rerun/topology-result.json
              grep -F '"'"'"kind"'"'": "'"'"heal"'"'"' rerun/topology-result.json
              grep -R '"'"'"value"'"'":1' rerun/services/counter/serial.log
            '
          source_commit=$(git rev-parse HEAD)
          image_digest=$(docker image inspect "$IMAGE:$TAG-$ARCH" --format '{{index .RepoDigests 0}}')
          evidence="$tutorial/minimized/evidence"
          source="$tutorial/minimized/source"
          mkdir -p "$evidence/replay/services" "$source/counter" "$source/worker" "$source/inputs/fixture"
          cp "$tutorial/campaign/campaign-result.json" "$evidence/campaign-result.json"
          cp "$tutorial/rerun/topology-result.json" "$evidence/replay/topology-result.json"
          cp "$tutorial/runtime-pivot.json" "$evidence/runtime-pivot.json"
          cp docs/tutorials/11-certify-runtime/certificate/certificate.json \
            "$evidence/runtime-certificate.json"
          for service in counter writer-a writer-b; do
            mkdir -p "$evidence/replay/services/$service"
            cp "$tutorial/rerun/services/$service/result.json" "$evidence/replay/services/$service/result.json"
            cp "$tutorial/rerun/services/$service"/serial*.log "$evidence/replay/services/$service/"
          done
          cp "$tutorial/README.md" "$tutorial/compose.yaml" "$source/"
          cp "$tutorial/counter/Dockerfile" "$tutorial/counter/increment" \
            "$tutorial/counter/theseus.toml" "$source/counter/"
          cp "$tutorial/worker/Dockerfile" "$tutorial/worker/check" \
            "$tutorial/worker/increment" "$tutorial/worker/theseus.toml" "$source/worker/"
          cp "$tutorial/inputs/worker.conf" "$tutorial/inputs/worker.env" \
            "$tutorial/inputs/token" "$source/inputs/"
          cp "$tutorial/inputs/fixture/identity" "$source/inputs/fixture/"
          kvm_api=$(python3 -c 'import fcntl, os; fd = os.open("/dev/kvm", os.O_RDWR); print(fcntl.ioctl(fd, 0xAE00, 0))')
          python3 scripts/native_runtime_evidence.py seal \
            --root "$tutorial/minimized" \
            --architecture "$ARCH" \
            --source-commit "$source_commit" \
            --runtime-image "$image_digest" \
            --runtime-tag "$TAG-$ARCH" \
            --host-kernel "$(uname -r)" \
            --kvm-api-version "$kvm_api"
          source_date_epoch=$(git show -s --format=%ct "$source_commit")
          archive="theseus-${TAG}-multiservice-counterexample-${ARCH}.tar.gz"
          python3 scripts/reproducible_tar.py \
            --mtime "$source_date_epoch" --output "$archive" "$tutorial/minimized"

      - name: Stage architecture evidence
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir native-evidence
          mv "theseus-${TAG}-runtime-certificate-${ARCH}.json" native-evidence/
          mv "theseus-${TAG}-multiservice-counterexample-${ARCH}.tar.gz" native-evidence/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-evidence-${{ matrix.arch }}
          path: native-evidence/*
          if-no-files-found: error

  publish:
    name: verify and publish complete evidence set
    needs: [resolve, certify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-evidence-*
          path: native-evidence
          merge-multiple: true

      - name: Index and verify both native architectures
        env:
          COMMIT: ${{ needs.resolve.outputs.commit }}
          IMAGE: ghcr.io/e6qu/theseus
          TAG: ${{ inputs.tag }}
        run: |
          index="native-evidence/theseus-${TAG}-native-evidence.json"
          python3 scripts/native_runtime_evidence.py index \
            --directory native-evidence --tag "$TAG" --source-commit "$COMMIT" \
            --output "$index"
          docker pull "$IMAGE:$TAG-amd64"
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE/native-evidence":/evidence:ro \
            --entrypoint /usr/local/bin/theseus "$IMAGE:$TAG-amd64" \
            evidence verify "/evidence/$(basename "$index")"

      - name: Attest the complete native evidence set
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: native-evidence/*

      - name: Attach the complete evidence set to the SHA release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            native-evidence/*-runtime-certificate-*.json \
            native-evidence/*-multiservice-counterexample-*.tar.gz --clobber
          gh release upload "$TAG" \
            "native-evidence/theseus-${TAG}-native-evidence.json" --clobber
