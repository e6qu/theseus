name: publish-runtime

on:
  push:
    branches: [main]

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write

env:
  IMAGE: ghcr.io/e6qu/theseus

jobs:
  runtime:
    name: runtime (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}-${{ matrix.arch }}

      - name: Attest the architecture runtime image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # Artifact metadata storage records require an organization-owned repo.
          create-storage-record: false

      - name: Smoke-test the published runtime image
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker pull "${IMAGE}:${TAG}-${{ matrix.arch }}"
          docker run --rm --entrypoint /bin/sh "${IMAGE}:${TAG}-${{ matrix.arch }}" -ec '
            test -x /usr/local/bin/firecracker
            test -x /usr/local/bin/theseus
            test -x /usr/local/bin/theseus-topology
            test -x /usr/local/bin/theseus-explorer
            test -s /opt/theseus/vmlinux
            /usr/local/bin/firecracker --version
            /usr/local/bin/theseus --help >/dev/null
          '

      - name: Package the matching runtime bundle
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker pull "${IMAGE}:${TAG}-${{ matrix.arch }}"
          container=$(docker create "${IMAGE}:${TAG}-${{ matrix.arch }}")
          mkdir "theseus-${TAG}-linux-${{ matrix.arch }}"
          docker cp "$container:/usr/local/bin/firecracker" "theseus-${TAG}-linux-${{ matrix.arch }}/firecracker"
          docker cp "$container:/usr/local/bin/theseus" "theseus-${TAG}-linux-${{ matrix.arch }}/theseus"
          docker cp "$container:/usr/local/bin/theseus-topology" "theseus-${TAG}-linux-${{ matrix.arch }}/theseus-topology"
          docker cp "$container:/usr/local/bin/theseus-explorer" "theseus-${TAG}-linux-${{ matrix.arch }}/theseus-explorer"
          docker cp "$container:/opt/theseus/vmlinux" "theseus-${TAG}-linux-${{ matrix.arch }}/vmlinux"
          docker cp "$container:/opt/theseus/." "theseus-${TAG}-linux-${{ matrix.arch }}/"
          docker rm "$container"
          chmod +x "theseus-${TAG}-linux-${{ matrix.arch }}/firecracker"
          chmod +x "theseus-${TAG}-linux-${{ matrix.arch }}/theseus"
          chmod +x "theseus-${TAG}-linux-${{ matrix.arch }}/theseus-topology"
          chmod +x "theseus-${TAG}-linux-${{ matrix.arch }}/theseus-explorer"
          (
            cd "theseus-${TAG}-linux-${{ matrix.arch }}"
            sha256sum ./* > SHA256SUMS
          )
          tar -czf "theseus-${TAG}-linux-${{ matrix.arch }}.tar.gz" "theseus-${TAG}-linux-${{ matrix.arch }}"
          tar -tzf "theseus-${TAG}-linux-${{ matrix.arch }}.tar.gz" | grep -Fx \
            "theseus-${TAG}-linux-${{ matrix.arch }}/firecracker"
          mkdir extracted
          tar -xzf "theseus-${TAG}-linux-${{ matrix.arch }}.tar.gz" -C extracted
          (
            cd "extracted/theseus-${TAG}-linux-${{ matrix.arch }}"
            sha256sum -c SHA256SUMS
          )

      - name: Generate the runtime SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}-${{ matrix.arch }}
          format: spdx-json
          output-file: theseus-${{ steps.tag.outputs.value }}-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.arch }}
          retention-days: 1
          path: |
            theseus-*-linux-${{ matrix.arch }}.tar.gz
            theseus-*-linux-${{ matrix.arch }}.spdx.json

  cli-macos-arm64:
    name: CLI (macos arm64)
    runs-on: macos-14
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@1.97.0

      - name: Build and package the CLI
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          cargo build --manifest-path cli/Cargo.toml --release --locked
          mkdir "theseus-${TAG}-darwin-arm64"
          cp cli/target/release/theseus "theseus-${TAG}-darwin-arm64/theseus"
          (
            cd "theseus-${TAG}-darwin-arm64"
            shasum -a 256 theseus > SHA256SUMS
          )
          tar -czf "theseus-${TAG}-darwin-arm64.tar.gz" "theseus-${TAG}-darwin-arm64"

      - name: Generate the CLI SBOM
        uses: anchore/sbom-action@v0
        with:
          path: theseus-${{ steps.tag.outputs.value }}-darwin-arm64
          format: spdx-json
          output-file: theseus-${{ steps.tag.outputs.value }}-darwin-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@v4
        with:
          name: cli-macos-arm64
          retention-days: 1
          path: |
            theseus-*-darwin-arm64.tar.gz
            theseus-*-darwin-arm64.spdx.json

  manifest-and-release:
    needs: [runtime, cli-macos-arm64]
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ needs.runtime.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-architecture manifest
        id: manifest
        env:
          TAG: ${{ needs.runtime.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          echo "digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Attest the multi-architecture runtime image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          # Artifact metadata storage records require an organization-owned repo.
          create-storage-record: false

      # build-push-action also uploads its .dockerbuild record. Select the
      # three release archives explicitly: downloading every artifact makes
      # the release job try to extract that record as a user-facing bundle.
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: cli-macos-arm64
          path: release
          merge-multiple: true

      - name: Package the SDK
        run: |
          cargo package --manifest-path sdk/Cargo.toml --allow-dirty
          cp sdk/target/package/theseus-sdk-*.crate release/

      - name: Generate the SDK SBOM
        uses: anchore/sbom-action@v0
        with:
          file: release/theseus-sdk-0.1.0.crate
          format: spdx-json
          output-file: release/theseus-sdk-0.1.0.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksum every release asset
        run: |
          (
            cd release
            sha256sum ./* > SHA256SUMS
          )

      - name: Attest every release asset
        uses: actions/attest@v4
        with:
          subject-path: release/*

      - name: Create the draft SHA release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.runtime.outputs.tag }}
        run: |
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Theseus $TAG" \
            --notes "Runtime bundles and the multi-architecture container are pinned to commit $GITHUB_SHA."

  runtime-release-consumer:
    name: runtime release consumer (${{ matrix.arch }})
    needs: manifest-and-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.manifest-and-release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Consume the published multi-architecture image
        run: |
          docker pull "${IMAGE}:${TAG}"
          test "$(docker image inspect "${IMAGE}:${TAG}" --format '{{.Architecture}}')" = "${{ matrix.arch }}"
          gh attestation verify "oci://${IMAGE}:${TAG}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main
          docker run --rm --entrypoint /bin/sh "${IMAGE}:${TAG}" -ec '
            test -x /usr/local/bin/firecracker
            test -x /usr/local/bin/theseus
            test -x /usr/local/bin/theseus-topology
            test -x /usr/local/bin/theseus-explorer
            test -s /opt/theseus/vmlinux
            /usr/local/bin/firecracker --version
            /usr/local/bin/theseus --help >/dev/null
          '

      - name: Consume the published runtime archive
        run: |
          consumer=$(mktemp -d)
          trap 'rm -rf "$consumer"' EXIT
          archive="theseus-${TAG}-linux-${{ matrix.arch }}.tar.gz"
          sbom="theseus-${TAG}-linux-${{ matrix.arch }}.spdx.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern "$sbom" --pattern SHA256SUMS --dir "$consumer"
          (
            cd "$consumer"
            sha256sum --ignore-missing -c SHA256SUMS
          )
          gh attestation verify "$consumer/$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main
          gh attestation verify "$consumer/$sbom" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main
          jq -e '(.spdxVersion | startswith("SPDX-")) and (.packages | type == "array")' \
            "$consumer/$sbom" >/dev/null
          tar -tzf "$consumer/$archive" | grep -Fx \
            "theseus-${TAG}-linux-${{ matrix.arch }}/firecracker"
          mkdir "$consumer/extracted"
          tar -xzf "$consumer/$archive" -C "$consumer/extracted"
          (
            cd "$consumer/extracted/theseus-${TAG}-linux-${{ matrix.arch }}"
            sha256sum -c SHA256SUMS
            test -x firecracker
            test -x theseus
            test -x theseus-topology
            test -x theseus-explorer
            test -s vmlinux
            ./firecracker --version
            ./theseus --help >/dev/null
          )

  cli-release-consumer:
    name: CLI release consumer (macos arm64)
    needs: manifest-and-release
    runs-on: macos-14
    env:
      TAG: ${{ needs.manifest-and-release.outputs.tag }}
    steps:
      - name: Consume the published macOS CLI archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          consumer=$(mktemp -d)
          trap 'rm -rf "$consumer"' EXIT
          archive="theseus-${TAG}-darwin-arm64.tar.gz"
          sbom="theseus-${TAG}-darwin-arm64.spdx.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern "$sbom" --pattern SHA256SUMS --dir "$consumer"
          expected=$(awk -v asset="./$archive" '$2 == asset { print $1 }' "$consumer/SHA256SUMS")
          actual=$(shasum -a 256 "$consumer/$archive" | awk '{ print $1 }')
          test -n "$expected"
          test "$actual" = "$expected"
          expected=$(awk -v asset="./$sbom" '$2 == asset { print $1 }' "$consumer/SHA256SUMS")
          actual=$(shasum -a 256 "$consumer/$sbom" | awk '{ print $1 }')
          test -n "$expected"
          test "$actual" = "$expected"
          gh attestation verify "$consumer/$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main
          gh attestation verify "$consumer/$sbom" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main
          jq -e '(.spdxVersion | startswith("SPDX-")) and (.packages | type == "array")' \
            "$consumer/$sbom" >/dev/null
          mkdir "$consumer/extracted"
          tar -xzf "$consumer/$archive" -C "$consumer/extracted"
          (
            cd "$consumer/extracted/theseus-${TAG}-darwin-arm64"
            shasum -a 256 -c SHA256SUMS
            test -x theseus
            ./theseus --help >/dev/null
          )

  sdk-release-consumer:
    name: SDK release consumer
    needs: manifest-and-release
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.manifest-and-release.outputs.tag }}
    steps:
      - uses: dtolnay/rust-toolchain@1.97.0

      - name: Compile the published SDK crate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          consumer=$(mktemp -d)
          trap 'rm -rf "$consumer"' EXIT
          mkdir -p "$consumer/release" "$consumer/package" "$consumer/app/src"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'theseus-sdk-*.crate' --pattern 'theseus-sdk-*.spdx.json' \
            --pattern SHA256SUMS --dir "$consumer/release"
          (
            cd "$consumer/release"
            sha256sum --ignore-missing -c SHA256SUMS
          )
          crate=$(find "$consumer/release" -maxdepth 1 -type f -name 'theseus-sdk-*.crate')
          test -n "$crate"
          sbom=$(find "$consumer/release" -maxdepth 1 -type f -name 'theseus-sdk-*.spdx.json')
          test -n "$sbom"
          gh attestation verify "$crate" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main
          gh attestation verify "$sbom" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main
          jq -e '(.spdxVersion | startswith("SPDX-")) and (.packages | type == "array")' \
            "$sbom" >/dev/null
          tar -xzf "$crate" -C "$consumer/package"
          sdk=$(find "$consumer/package" -mindepth 1 -maxdepth 1 -type d -name 'theseus-sdk-*')
          test -f "$sdk/Cargo.toml"
          mv "$sdk" "$consumer/sdk"
          cat > "$consumer/app/Cargo.toml" <<'EOF'
          [package]
          name = "published-sdk-consumer"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          theseus-sdk = { path = "../sdk" }
          EOF
          cat > "$consumer/app/src/main.rs" <<'EOF'
          fn main() {
              assert_eq!(theseus_sdk::MAGIC, u32::from_le_bytes(*b"THES"));
              assert_eq!(theseus_sdk::EVENT_TERMINATOR, 0);
          }
          EOF
          cargo run --manifest-path "$consumer/app/Cargo.toml" --quiet

  publish-release:
    name: publish verified release
    needs:
      [manifest-and-release, runtime-release-consumer, cli-release-consumer, sdk-release-consumer]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.manifest-and-release.outputs.tag }}
    steps:
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  discard-failed-draft:
    name: discard failed draft release
    if: >-
      ${{
        always() &&
        needs.manifest-and-release.result == 'success' &&
        (needs.runtime-release-consumer.result == 'failure' ||
         needs.cli-release-consumer.result == 'failure' ||
         needs.sdk-release-consumer.result == 'failure')
      }}
    needs:
      [manifest-and-release, runtime-release-consumer, cli-release-consumer, sdk-release-consumer]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.manifest-and-release.outputs.tag }}
    steps:
      - name: Delete the unverified draft and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
