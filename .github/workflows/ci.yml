name: ci

# Runs on pull requests only. Not on raw pushes, not on main.
on:
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libclang-dev libseccomp-dev

      - name: Install Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd

      - name: Check workspace
        working-directory: firecracker
        run: cargo check --workspace

      - name: Check theseus crates
        run: |
          cargo check --manifest-path sdk/Cargo.toml
          cargo check --manifest-path engine/Cargo.toml
          cargo check --manifest-path orchestrator/Cargo.toml
          cargo check --manifest-path orchestrator/pivot/Cargo.toml
          cargo check --manifest-path cli/Cargo.toml --locked
          cargo check --manifest-path topology-runner/Cargo.toml --locked
          cargo check --manifest-path image-runner/Cargo.toml --locked
          cargo check --manifest-path explorer-runner/Cargo.toml --locked

      - name: Theseus crate tests
        run: |
          cargo test --manifest-path engine/Cargo.toml
          cargo test --manifest-path orchestrator/Cargo.toml -- branch::tests orchestrator::tree
          cargo test --manifest-path orchestrator/Cargo.toml -- oci::tests
          cargo test --manifest-path cli/Cargo.toml --locked
          cargo test --manifest-path topology-runner/Cargo.toml --locked
          cargo test --manifest-path image-runner/Cargo.toml --locked
          cargo test --manifest-path explorer-runner/Cargo.toml --locked

      - name: Deterministic unit suites
        working-directory: firecracker
        run: >-
          cargo test -p vmm --lib --
          --test-threads=1
          vclock
          pseudo::theseus
          devices::virtio::rng
          net::sim
          branch::tests
          orchestrator::tree
          vmm_config::machine_config
          vmm_config::entropy
          detrng
          rate_limiter::tests

      - name: Check self-contained tutorials
        run: |
          sh -n docs/tutorials/01-replay-by-seed/run.sh
          sh -n docs/tutorials/02-control-the-random/run.sh
          sh -n docs/tutorials/03-the-control-channel/build.sh
          sh -n docs/tutorials/04-read-serial/run.sh
          sh -n docs/tutorials/05-compose-topology/run.sh
          sh -n docs/tutorials/06-lifecycle-clock/run.sh
          sh -n docs/tutorials/07-storage-faults/run.sh
          sh -n docs/tutorials/08-explore-sdk-guest/build.sh
          sh -n docs/tutorials/08-explore-sdk-guest/run.sh
          sh -n docs/tutorials/09-inspect-report/run.sh
          sh -n docs/tutorials/10-autonomous-compose-campaign/run.sh
          sh -n docs/tutorials/11-certify-runtime/run.sh
          sh -n docs/tutorials/12-investigate-campaign/run.sh
          sh -n docs/tutorials/13-public-evaluation/run.sh
          sh -n docs/tutorials/14-container-image/run.sh
          sh -n docs/tutorials/14-container-image/run-in-runtime.sh
          sh -n docs/tutorials/15-container-campaign/run.sh
          sh -n docs/tutorials/15-container-campaign/run-in-runtime.sh
          sh -n docs/tutorials/16-public-campaign/run.sh
          sh -n docs/tutorials/16-public-campaign/run-in-runtime.sh
          sh -n docs/tutorials/17-grpc-campaign/run.sh
          sh -n docs/tutorials/17-grpc-campaign/run-in-runtime.sh
          sh -n docs/tutorials/18-container-command/run.sh
          sh -n docs/tutorials/18-container-command/run-in-runtime.sh
          sh -n docs/tutorials/19-compose-image-network/run.sh
          sh -n docs/tutorials/19-compose-image-network/run-in-runtime.sh
          ! rg -n '/dev/hwrng|(^|[[:space:]])/theseus/|\.\./\.\./\.\.' docs/tutorials

      - name: Check reproducible release archives
        run: |
          python3 scripts/tests/test_reproducible_tar.py
          python3 scripts/tests/test_runtime_reproducibility.py
          python3 scripts/tests/test_release_build_inputs.py
          python3 scripts/tests/test_action_pins.py
          python3 scripts/tests/test_rebuild_witness.py
