name: ci

# Runs on pull requests only. Not on raw pushes, not on main.
on:
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static clang cpio golang-go libclang-dev libclang-rt-dev libseccomp-dev llvm musl-tools

      - name: Install Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@86e7197484018ef6aaa9255d186f6ce1754276dd

      - name: Check workspace
        working-directory: firecracker
        run: cargo check --workspace

      - name: Deterministic unit suites
        working-directory: firecracker
        run: |
          cargo test -p vmm --lib -- \
            --test-threads=1 \
            vclock \
            pseudo::theseus \
            devices::virtio::rng \
            net::sim \
            branch::tests \
            orchestrator::tree \
            vmm_config::machine_config \
            vmm_config::entropy \
            execution_ledger \
            detrng \
            rate_limiter::tests
          cargo test -p vmm --lib simulated_storage -- --test-threads=1
          cargo test -p vmm --lib unactivated_simulated -- --test-threads=1
          cargo test -p vmm --lib checkpoint -- --test-threads=1
          cargo test -p firecracker -- api_server::request::execution

      - name: Check self-contained tutorials
        run: |
          sh -n docs/tutorials/01-replay-by-seed/run.sh
          sh -n docs/tutorials/02-control-the-random/run.sh
          sh -n docs/tutorials/04-read-serial/init
          python3 scripts/tests/test_tutorial_readmes.py
          python3 scripts/tests/test_documentation_claims.py
          python3 scripts/tests/test_documentation_links.py
          ! rg -n '/dev/hwrng|(^|[[:space:]])/theseus/|\.\./\.\./\.\.' docs/tutorials

      - name: Replay UART input and guest reset on native KVM
        working-directory: docs/tutorials/04-read-serial
        run: |
          test -c /dev/kvm
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            sudo chmod 666 /dev/kvm
          fi
          (cd ../../../firecracker && cargo build -p firecracker)
          cargo build --manifest-path ../../../cli/Cargo.toml --locked
          release=$(mktemp -d)
          tag=7eee61be7fd8
          url="https://github.com/e6qu/theseus/releases/download/$tag"
          curl -fsSL "$url/theseus-$tag-linux-amd64.tar.gz" -o "$release/theseus-$tag-linux-amd64.tar.gz"
          curl -fsSL "$url/SHA256SUMS" -o "$release/SHA256SUMS"
          (cd "$release" && sha256sum --check --ignore-missing SHA256SUMS)
          tar -xzf "$release/theseus-$tag-linux-amd64.tar.gz" -C "$release"
          mkdir -p work/runtime work/guest/root/bin
          cp ../../../firecracker/build/cargo_target/debug/firecracker work/runtime/firecracker
          cp "$release/theseus-$tag-linux-amd64/vmlinux" work/guest/vmlinux
          cp /bin/busybox work/guest/root/bin/busybox
          cp init work/guest/root/init
          chmod +x work/guest/root/init
          (cd work/guest/root && find . -print | cpio -o -H newc --quiet | gzip > ../initramfs.cpio.gz)
          ../../../cli/target/debug/theseus test --output work/replay theseus.toml
          grep -a '^sensor reading: 21.5C$' work/replay/serial.log
          for attempt in 1 2 3; do
            ../../../cli/target/debug/theseus replay --output "work/rerun-$attempt" work/replay
            cmp work/replay/execution.json "work/rerun-$attempt/execution.json"
          done
          python3 -c 'import json; e = json.load(open("work/replay/execution.json")); t = e["machine_execution_trace"]; assert "host:serial_input:6:32312e35430a" in t; assert t[-1] == "vcpu:0:pio_write:0x64:1:fe", t[-10:]'

      - name: Replay RNG and UART from a retained ready checkpoint on native KVM
        working-directory: docs/tutorials/42-replay-from-ready
        run: |
          mkdir -p work/runtime work/guest/root/bin
          cp ../04-read-serial/work/runtime/firecracker work/runtime/firecracker
          cp ../04-read-serial/work/guest/vmlinux work/guest/vmlinux
          cp /bin/busybox work/guest/root/bin/busybox
          cp init work/guest/root/init
          chmod +x work/guest/root/init
          (cd work/guest/root && find . -print | cpio -o -H newc --quiet | gzip > ../initramfs.cpio.gz)
          ../../../cli/target/debug/theseus test --output work/replay theseus.toml
          for attempt in 1 2 3; do
            ../../../cli/target/debug/theseus replay --output "work/rerun-$attempt" work/replay
            cmp work/replay/execution.json "work/rerun-$attempt/execution.json"
            cmp work/replay/serial.log "work/rerun-$attempt/serial.log"
          done
          python3 -c 'import json; e = json.load(open("work/replay/execution.json")); p = json.load(open("work/replay/checkpoint/metadata.json"))["execution"]["trace"]; assert e["start"]["kind"] == "checkpoint"; assert e["start"]["inherited_decisions"] == len(p); assert e["machine_execution_trace"][:len(p)] == p; assert "host:serial_input:6:32312e35430a" in e["machine_execution_trace"][len(p):]; assert e["boundary"] == "guest_exit" and e["replay_error"] is None'
          cp -a work/replay work/changed-input
          python3 -c 'import json; f = "work/changed-input/replay-plan.json"; p = json.load(open(f)); p["events"][0]["data_hex"] = "39392e39430a"; open(f, "w").write(json.dumps(p))'
          if ../../../cli/target/debug/theseus replay --output work/rejected-input work/changed-input; then
            exit 1
          fi
          python3 -c 'import json; e = json.load(open("work/rejected-input/execution.json")); assert e["replay_error"]; assert "host:serial_input:6:39392e39430a" not in e["machine_execution_trace"]; assert b"99.9C" not in open("work/rejected-input/serial.log", "rb").read()'
          cp -a work/replay work/tampered-checkpoint
          python3 -c 'f = open("work/tampered-checkpoint/checkpoint/memory", "r+b"); first = f.read(1); f.seek(0); f.write(bytes([first[0] ^ 1])); f.close()'
          if ../../../cli/target/debug/theseus replay --output work/rejected-checkpoint work/tampered-checkpoint; then
            exit 1
          fi
          test ! -e work/rejected-checkpoint

      - name: Certify and replay a retained whole topology on native KVM
        working-directory: docs/tutorials/11-certify-runtime
        run: |
          cargo build --manifest-path ../../../topology-runner/Cargo.toml --locked
          cp ../../../topology-runner/target/debug/theseus-topology ../../../cli/target/debug/theseus-topology
          mkdir -p service/runtime service/guest/root/bin
          cp ../04-read-serial/work/runtime/firecracker service/runtime/firecracker
          cp ../04-read-serial/work/guest/vmlinux service/guest/vmlinux
          cp /bin/busybox service/guest/root/bin/busybox
          for applet in mkdir mount reboot; do
            ln -sf busybox "service/guest/root/bin/$applet"
          done
          cp service/init service/guest/root/init
          chmod +x service/guest/root/init
          (cd service/guest/root && find . -print | cpio -o -H newc --quiet | gzip > ../initramfs.cpio.gz)
          ../../../cli/target/debug/theseus compose plan > plan.json
          ../../../cli/target/debug/theseus-topology certify --plan plan.json --output certificate
          for attempt in 1 2 3; do
            ../../../cli/target/debug/theseus compose replay certificate/first --output "certificate/rerun-$attempt"
            python3 -c 'import json,sys; a=json.load(open("certificate/first/services/service/result.json")); b=json.load(open(sys.argv[1])); assert b["status"]=="passed", b; assert a["machine_execution_trace"]==b["machine_execution_trace"]; assert a["execution_start"]==b["execution_start"]' "certificate/rerun-$attempt/services/service/result.json"
          done
          python3 -c 'import json; c=json.load(open("certificate/certificate.json")); assert c["format"]=="theseus-runtime-certificate-v5"; e=json.load(open("certificate/first/services/service/result.json")); n=e["execution_start"]["inherited_decisions"]; assert 0<n<len(e["machine_execution_trace"]); assert "host:serial_input:7:66696e6973680a" in e["machine_execution_trace"][n:]'
          python3 -c 'import copy,json; p=json.load(open("plan.json")); p["services"]["peer"]=copy.deepcopy(p["services"]["service"]); p["services"]["peer"]["run"]["run"]["seed"]=72; p["services"]["service"]["depends_on"]=[{"service":"peer","condition":"service_started"}]; p["networks"]["backplane"]=["peer","service"]; open("certificate/two-services-plan.json","w").write(json.dumps(p))'
          ../../../cli/target/debug/theseus-topology certify --plan certificate/two-services-plan.json --output certificate/two-services
          ../../../cli/target/debug/theseus compose replay certificate/two-services/first --output certificate/two-services/rerun
          python3 -c 'import json; c=json.load(open("certificate/two-services/certificate.json")); assert set(c["services"])=={"peer","service"}; a=json.load(open("certificate/two-services/first/services/peer/result.json")); b=json.load(open("certificate/two-services/rerun/services/peer/result.json")); assert a["machine_execution_trace"]==b["machine_execution_trace"]; assert a["execution_start"]==b["execution_start"]'
          cp -a certificate/first certificate/tampered
          python3 -c 'p="certificate/tampered/checkpoint/starting-state/service/memory"; f=open(p,"r+b"); b=f.read(1); f.seek(0); f.write(bytes([b[0]^1])); f.close()'
          if ../../../cli/target/debug/theseus compose replay certificate/tampered --output certificate/rejected; then exit 1; fi
          test ! -e certificate/rejected
          cp -a certificate/first certificate/startup-divergence
          python3 -c 'import json; p="certificate/startup-divergence/replay-plan.json"; v=json.load(open(p)); v["replay_start"]="fresh_boot"; v.pop("starting_checkpoint"); v.pop("checkpoint_prefixes"); open(p,"w").write(json.dumps(v)); p="certificate/startup-divergence/services/service/result.json"; v=json.load(open(p)); v.pop("execution_start"); v["machine_execution_trace"][0]="vcpu:0:pio_write:0x64:1:fe"; open(p,"w").write(json.dumps(v))'
          if ../../../cli/target/debug/theseus compose replay certificate/startup-divergence --output certificate/startup-rejected; then exit 1; fi
          python3 -c 'import json; e=json.load(open("certificate/startup-rejected/services/service/execution-error.json")); assert e["replay_error"] and e["boundary"]=="runtime_error"; assert "dependency startup" not in e["replay_error"]'

      - name: Retain whole-topology replay diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-topology-checkpoint-replay
          path: docs/tutorials/11-certify-runtime/certificate/
          if-no-files-found: ignore

      - name: Retain ready-checkpoint replay diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ready-checkpoint-replay
          path: docs/tutorials/42-replay-from-ready/work/
          if-no-files-found: ignore

      - name: Report native replay divergence
        if: failure()
        run: |
          for evidence in docs/tutorials/{04-read-serial,42-replay-from-ready}/work/*/execution.json; do
            if test -f "$evidence"; then
              jq '{boundary, replay_error, ledger: .machine_execution_ledger}' "$evidence"
            fi
          done

      - name: Retain native replay diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-uart-replay
          path: docs/tutorials/04-read-serial/work/
          if-no-files-found: ignore

      - name: Check theseus crates
        run: |
          ./orchestrator/pivot/build.sh --target amd64
          cargo check --manifest-path sdk/Cargo.toml
          cargo check --manifest-path engine/Cargo.toml
          cargo check --manifest-path orchestrator/Cargo.toml
          cargo check --manifest-path orchestrator/pivot/Cargo.toml
          cargo check --manifest-path cli/Cargo.toml --locked
          cargo check --manifest-path topology-runner/Cargo.toml --locked
          cargo check --manifest-path image-runner/Cargo.toml --locked
          cargo check --manifest-path explorer-runner/Cargo.toml --locked

      - name: Theseus crate tests
        run: |
          cargo test --manifest-path engine/Cargo.toml
          cargo test --manifest-path orchestrator/Cargo.toml -- branch::tests orchestrator::tree
          cargo test --manifest-path orchestrator/Cargo.toml -- oci::tests
          cargo test --manifest-path orchestrator/pivot/Cargo.toml
          cargo test --manifest-path cli/Cargo.toml --locked
          cargo test --manifest-path topology-runner/Cargo.toml --locked
          cargo test --manifest-path image-runner/Cargo.toml --locked
          cargo test --manifest-path explorer-runner/Cargo.toml --locked

      - name: Qualify ordinary checkpoint-backed product workflows on native KVM
        env:
          THESEUS_ARCH: amd64
          THESEUS_IMAGE: ghcr.io/e6qu/theseus:8c9b9f6c82e3-amd64
        run: |
          cargo build --manifest-path image-runner/Cargo.toml --locked
          mkdir -p .native-evidence/amd64/source-runtime
          runtime="$GITHUB_WORKSPACE/.native-evidence/amd64/source-runtime"
          cp cli/target/debug/theseus "$runtime/theseus"
          cp topology-runner/target/debug/theseus-topology "$runtime/theseus-topology"
          cp image-runner/target/debug/theseus-image "$runtime/theseus-image"
          cp firecracker/build/cargo_target/debug/firecracker "$runtime/firecracker"
          cp docs/tutorials/04-read-serial/work/guest/vmlinux "$runtime/vmlinux"
          export THESEUS_SOURCE_RUNTIME="$runtime"
          export THESEUS_TAG=$(git rev-parse --short=12 HEAD)
          docker pull "$THESEUS_IMAGE"
          sh scripts/run_native_validation.sh
          sh scripts/run_native_counterexample.sh

      - name: Retain native product workflow diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-product-workflows
          path: |
            .native-evidence/amd64/validation/
            docs/tutorials/30-multiservice-lost-update/campaign/
            docs/tutorials/30-multiservice-lost-update/minimized/
            docs/tutorials/30-multiservice-lost-update/rerun/
            docs/tutorials/30-multiservice-lost-update/retained/
          if-no-files-found: ignore

      - name: Retain failed product inputs and execution diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-product-failure
          path: |
            docs/tutorials/14-container-image/work/replay/
            docs/tutorials/14-container-image/work/rerun/
            docs/tutorials/*/campaign/
            docs/tutorials/*/minimized/
            docs/tutorials/*/rerun/
          if-no-files-found: ignore

      - name: Check application instrumentation
        run: |
          sh scripts/tests/test_c_coverage.sh
          sh scripts/tests/test_c_schedule.sh
          sh scripts/tests/test_llvm_coverage.sh
          sh -n instrumentation/go/theseus-coverage-inspect

      - name: Check reproducible release archives
        run: |
          python3 scripts/tests/test_reproducible_tar.py
          python3 scripts/tests/test_runtime_reproducibility.py
          python3 scripts/tests/test_release_build_inputs.py
          python3 scripts/tests/test_action_pins.py
          python3 scripts/tests/test_rebuild_witness.py
          python3 scripts/tests/test_native_certification_workflow.py
          python3 scripts/tests/test_native_runtime_evidence.py
          python3 scripts/tests/test_runtime_validation_evidence.py
          python3 scripts/tests/test_source_runtime_validation.py
          sh -n scripts/run_native_validation.sh
          python3 scripts/tests/test_release_smoke_workflow.py
