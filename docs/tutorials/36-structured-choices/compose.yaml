name: structured-choices

services:
  chooser:
    x-theseus:
      manifest: service/theseus.toml
    networks: [test]

networks:
  test: {}

x-theseus:
  campaign:
    driver: chooser
    guidance: unified
    max_runs: 6
    max_operations_per_run: 1
    operations:
      - name: calculate
        shell:
          command: [/usr/local/bin/chooser]
          output_json: true
          choices:
            mode: 2
            retry: 3
    properties:
      - name: corrupt_result_is_unreachable
        kind: unreachable
        service: chooser
        contains: '"status":"corrupt"'
