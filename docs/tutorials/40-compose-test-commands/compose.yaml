name: test-command-lifecycle

services:
  api:
    x-theseus:
      manifest: api/theseus.toml
    networks: [test]

networks:
  test: {}

x-theseus:
  campaign:
    driver: api
    test_template: lost-update
    max_parallel_commands: 2
    max_runs: 128
    max_operations_per_run: 8
    faults: []
    properties:
      - name: lost_update_is_unreachable
        kind: unreachable
        service: api
        predicate:
          json:
            fields: {/event: shell_operation, /output/value: 1, /output/commits: 2}
