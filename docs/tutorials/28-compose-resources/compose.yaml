name: compose-resources

services:
  api:
    x-theseus:
      manifest: api/theseus.toml
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 192MiB
    tmpfs:
      - /run/scratch:size=1048576
    networks: [backplane]

networks:
  backplane: {}

x-theseus:
  campaign:
    driver: api
    max_runs: 1
    max_operations_per_run: 1
    faults: []
    operations:
      - name: inspect_cpus
        shell:
          command: [/bin/busybox, nproc]
          expect_exit: 0
          output_contains: "2"
