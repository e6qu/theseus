version = 1

[runtime]
firecracker = "work/runtime/firecracker"
image_adapter = "work/runtime/theseus-image"

[guest]
kernel = "work/guest/vmlinux"
image = "work/api.tar"

[run]
seed = 42
vcpu_count = 1
mem_size_mib = 128
timeout_secs = 30

[network]
loopback = false

[container_service.ready]
url = "http://127.0.0.1:8080/health"
