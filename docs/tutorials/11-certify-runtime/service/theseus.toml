version = 1

[runtime]
firecracker = "runtime/firecracker"

[guest]
kernel = "guest/vmlinux"
initramfs = "guest/initramfs.cpio.gz"

[run]
seed = 71
vcpu_count = 1
mem_size_mib = 128
timeout_secs = 5
max_rounds = 10000000

[run.virtual_time]
tick_ns = 1000000
exits_per_tick = 10

[network]
loopback = false

[[storage]]
id = "state"
size_mib = 1

[[events]]
when = "ready"
channel = "serial"
data_hex = "66696e6973680a"

[[checks]]
name = "service completed"
kind = "serial_contains"
value = "finished"
