name: container-command

services:
  api:
    x-theseus:
      manifest: api/theseus.toml
    networks: [backplane]

networks:
  backplane: {}

x-theseus:
  campaign:
    driver: api
    max_runs: 1
    max_operations_per_run: 1
    faults: []
    operations:
      - name: read_health_file
        shell:
          command: [/bin/cat, /www/health]
          output_contains: ok
          output_json: true
    properties:
      - name: command_reported_ok
        kind: always
        service: api
        predicate:
          json:
            fields:
              /event: shell_operation
              /name: read_health_file
              /output/status: ok
              /output/schema: 1
