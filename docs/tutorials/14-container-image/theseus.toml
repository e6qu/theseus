version = 1

[runtime]
firecracker = "work/runtime/firecracker"
image_adapter = "work/runtime/theseus-image"

[guest]
kernel = "work/guest/vmlinux"
image = "work/service.tar"

[run]
seed = 42
vcpu_count = 1
mem_size_mib = 128
timeout_secs = 30

[network]
loopback = false

[container_service.ready]
url = "http://127.0.0.1:8080/health"

[[container_service.operations]]
name = "read_health"
url = "http://127.0.0.1:8080/health"
body_contains = "ok"

[[container_service.assertions]]
name = "health"
url = "http://127.0.0.1:8080/health"
expect_status = 200
body_contains = "ok"
