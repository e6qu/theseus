version = 1

[runtime]
firecracker = "work/runtime/firecracker"

[guest]
kernel = "work/guest/vmlinux"
initramfs = "work/guest/initramfs.cpio"

[run]
seed = 42
vcpu_count = 1
mem_size_mib = 128
timeout_secs = 30

[network]
loopback = false

[[checks]]
name = "container command ran"
kind = "serial_contains"
value = "container image booted"
