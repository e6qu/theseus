name: multiservice-lost-update

configs:
  worker_config:
    file: inputs/worker.conf

secrets:
  worker_token:
    file: inputs/token

services:
  counter:
    x-theseus:
      manifest: counter/theseus.toml
    read_only: true
    tmpfs: [/state]
    cpus: 1
    mem_limit: 128M
    healthcheck:
      test: [CMD, /bin/busybox, wget, -qO-, http://127.0.0.1:8080/health]
      interval: 100ms
      retries: 5
    networks: [backplane]

  writer-a:
    x-theseus:
      manifest: worker/theseus.toml
    depends_on:
      counter:
        condition: service_healthy
    env_file: inputs/worker.env
    environment:
      WORKER_MODE: network
    entrypoint: [/bin/sh, -c]
    command: ["/bin/busybox wget -qO- http://counter:8080/health >/dev/null; exec /bin/httpd -f -p 8080 -h /www"]
    working_dir: /work
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    configs:
      - source: worker_config
        target: /etc/worker.conf
    secrets:
      - source: worker_token
        target: /run/secrets/token
    volumes:
      - type: bind
        source: ./inputs/fixture
        target: /fixtures
    cpus: "1"
    mem_limit: 128MiB
    healthcheck:
      test: [CMD, /work/check]
      interval: 100ms
      retries: 5
    networks: [backplane]

  writer-b:
    x-theseus:
      manifest: worker/theseus.toml
    depends_on:
      counter:
        condition: service_healthy
    env_file: inputs/worker.env
    environment:
      WORKER_MODE: network
    entrypoint: [/bin/sh, -c]
    command: ["/bin/busybox wget -qO- http://counter:8080/health >/dev/null; exec /bin/httpd -f -p 8080 -h /www"]
    working_dir: /work
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    configs:
      - source: worker_config
        target: /etc/worker.conf
    secrets:
      - source: worker_token
        target: /run/secrets/token
    volumes:
      - ./inputs/fixture:/fixtures
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 128M
    healthcheck:
      test: [CMD, /work/check]
      interval: 100ms
      retries: 5
    networks: [backplane]

networks:
  backplane: {}

x-theseus:
  replay_start: ready_checkpoint
  campaign:
    driver: counter
    state: {phase: new, a: idle, b: idle}
    max_runs: 64
    max_faults_per_run: 2
    max_operations_per_run: 11
    faults:
      - kind: partition
        required: true
        network: backplane
        after: setup
      - kind: heal
        required: true
        network: backplane
        after: probe_partition
    operations:
      - name: setup
        service: counter
        max_uses: 1
        requires_state: {phase: new}
        sets_state: {phase: partitioned}
        shell:
          phase: setup
          command: [/bin/sh, -c, "rm -f /state/*; echo 0 > /state/counter; mkfifo /state/a.ready /state/b.ready /state/a.go /state/b.go"]

      - name: probe_partition
        service: writer-a
        max_uses: 1
        requires_state: {phase: partitioned}
        sets_state: {phase: partition_probed}
        shell:
          command: [/bin/sh, -c, "/work/probe; printf '{\"network\":\"partition_probe_sent\"}\n'"]
          output_json: true

      - name: verify_recovery
        service: writer-a
        max_uses: 1
        requires_state: {phase: partition_probed}
        sets_state: {phase: ready}
        shell:
          command: [/bin/sh, -c, "/work/probe; printf '{\"network\":\"recovery_probe_sent\"}\n'"]
          output_json: true

      - name: launch_a
        service: writer-a
        max_uses: 1
        requires_state: {phase: ready, a: idle}
        sets_state: {a: running}
        shell:
          phase: launch
          process: increment
          command: [/work/increment, a]

      - name: release_a
        service: counter
        max_uses: 1
        requires_state: {a: running, b: idle}
        sets_state: {a: released}
        shell:
          command: [/bin/sh, -c, "read -r ready < /state/a.ready; test \"$ready\" = ready; printf 'go\n' > /state/a.go"]

      - name: complete_a
        service: writer-a
        max_uses: 1
        requires_state: {a: released}
        sets_state: {a: done}
        shell:
          phase: completion
          process: increment
          output_contains: '"worker":"a"'

      - name: launch_b_sequential
        service: writer-b
        max_uses: 1
        requires_state: {a: done, b: idle}
        sets_state: {b: running}
        shell:
          phase: launch
          process: increment
          command: [/work/increment, b]

      - name: release_b
        service: counter
        max_uses: 1
        requires_state: {a: done, b: running}
        sets_state: {b: released}
        shell:
          command: [/bin/sh, -c, "read -r ready < /state/b.ready; test \"$ready\" = ready; printf 'go\n' > /state/b.go"]

      - name: launch_b_overlapped
        service: writer-b
        max_uses: 1
        requires_state: {a: running, b: idle}
        sets_state: {b: running}
        shell:
          phase: launch
          process: increment
          command: [/work/increment, b]

      - name: release_both
        service: counter
        max_uses: 1
        requires_state: {a: running, b: running}
        sets_state: {a: released, b: released}
        shell:
          command: [/bin/sh, -c, "read -r ready_a < /state/a.ready; read -r ready_b < /state/b.ready; test \"$ready_a\" = ready; test \"$ready_b\" = ready; printf 'go\n' > /state/a.go; printf 'go\n' > /state/b.go"]

      - name: complete_b
        service: writer-b
        max_uses: 1
        requires_state: {b: released}
        sets_state: {b: done}
        shell:
          phase: completion
          process: increment
          output_contains: '"worker":"b"'

      - name: inspect
        service: counter
        max_uses: 1
        requires_state: {a: done, b: done}
        sets_state: {phase: inspected}
        shell:
          phase: assertion
          command: [/bin/sh, -c, "printf '{\"value\":%s}\n' \"$(cat /state/counter)\""]
          output_json: true

      - name: recover
        service: counter
        max_uses: 1
        requires_state: {phase: inspected}
        sets_state: {phase: recovered}
        shell:
          phase: recovery
          command: [/bin/sh, -c, "rm -f /state/*.ready /state/*.go; mkfifo /state/a.ready /state/b.ready /state/a.go /state/b.go"]

    properties:
      - name: network_recovery_is_reachable
        kind: reachable
        service: writer-a
        predicate:
          json:
            fields: {/event: shell_operation, /name: verify_recovery, /output/network: recovery_probe_sent}
      - name: sequential_result_is_reachable
        kind: reachable
        service: counter
        predicate:
          json:
            fields: {/event: shell_operation, /name: inspect, /output/value: 2}
      - name: distributed_lost_update_is_unreachable
        kind: unreachable
        service: counter
        predicate:
          json:
            fields: {/event: shell_operation, /name: inspect, /output/value: 1}
