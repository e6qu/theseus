name: compose-host-identity

services:
  api:
    x-theseus:
      manifest: api/theseus.toml
    hostname: api.local
    extra_hosts:
      cache.local: 10.9.0.7
    networks: [backplane]

networks:
  backplane: {}

x-theseus:
  campaign:
    driver: api
    max_runs: 1
    max_operations_per_run: 1
    faults: []
    operations:
      - name: inspect_host_identity
        shell:
          command: [/bin/busybox, sh, -c, 'test "$(hostname)" = api.local && grep -F "10.9.0.7 cache.local" /etc/hosts']
          expect_exit: 0
          output_contains: 10.9.0.7 cache.local
