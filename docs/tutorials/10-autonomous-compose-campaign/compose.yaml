name: campaign

services:
  api:
    x-theseus:
      manifest: api/theseus.toml
    networks: [backplane]
  replica:
    x-theseus:
      manifest: replica/theseus.toml
    networks: [backplane]
  auditor:
    x-theseus:
      manifest: auditor/theseus.toml
    networks: [backplane]

networks:
  backplane: {}

x-theseus:
  campaign:
    driver: api
    stages: [write, read, recovery]
    max_runs: 40
    # Explore every ordered operation history through this depth. Repetition is
    # intentional: it models retries and repeated reads without a host driver.
    max_operations_per_run: 3
    # Explore one candidate and ordered pairs. The run cap still bounds the
    # complete corpus, even if this list grows.
    max_faults_per_run: 2
    operations:
      - name: write
        input: "write\n"
        stage: write
        # The driver announces this boot marker before Theseus snapshots the
        # campaign root. Marker guards read the restored serial transcript.
        requires_markers: ["42"]
        max_uses: 1
      - name: read_stale
        input: "read_stale\n"
        stage: read
        requires_markers: [written]
        # A guard without service reads the driver. Select another service to
        # join its restored evidence into the operation decision.
        requires_serial:
          service: auditor
          json:
            fields:
              /event: ready
              /service: auditor
        max_uses: 1
      - name: retry
        input: "retry\n"
        stage: recovery
        requires_markers: [written]
        # Unlike marker guards, this inspects one structured event from the
        # driver's restored serial transcript. Retry only an identified stale
        # assertion; ordinary output cannot satisfy these correlated fields.
        # One expression mixes local evidence, a service guard, and a
        # composite JSON join. Retry only when every branch holds.
        requires_serial_evidence:
          all:
            # Default service is the driver: exactly one stale API assertion.
            - guard:
                occurs:
                  exactly: 1
                  predicate:
                    json:
                      fields:
                        /event: assertion
                        /name: consistent_read
                        /passed: false
                      where:
                        - pointer: /reason
                          equals: stale
            - guard:
                service: auditor
                json:
                  fields:
                    /event: ready
                    /service: auditor
                  arrays:
                    - pointer: /checks
                      any:
                        fields:
                          /name: serial
                          /passed: true
            # All three services must report the same request and attempt.
            - join:
                endpoints:
                  - pointers: [/request_id, /attempt]
                    json:
                      fields:
                        /event: operation
                        /name: write
                  - service: replica
                    pointers: [/request_id, /attempt]
                    json:
                      fields:
                        /event: replicated
                        /name: write
                  - service: auditor
                    pointers: [/request_id, /attempt]
                    json:
                      fields:
                        /event: audit
                        /name: write_observed
        max_uses: 1
    faults:
      # These run after the named operation emits its checkpoint. Every NIC
      # on this named network changes together, so the next operation sees a
      # real topology change rather than a per-service flag.
      - kind: partition
        network: backplane
        after: write
      - kind: heal
        network: backplane
        after: retry
      # Packet conditions are independent from partition state. This drops all
      # new frames after write, then restores each service's declared baseline
      # after retry without resetting traffic evidence or the seeded stream.
      - kind: network_fault
        network: backplane
        after: write
        drop_ppm: 1000000
        latency_rounds: 2
      - kind: network_recover
        network: backplane
        after: retry
      # Match only IPv4 Ethernet frames on api -> replica. Non-IPv4 frames
      # and api -> auditor keep flowing. Recovery removes only this rule.
      - kind: packet_fault
        network: backplane
        from: api
        to: replica
        after: write
        ethertype: 0x0800
        ip_protocol: 6
        destination_port: 8080
        drop_ppm: 1000000
      - kind: packet_recover
        network: backplane
        from: api
        to: replica
        after: retry
        ethertype: 0x0800
        ip_protocol: 6
        destination_port: 8080
      # A directed link fault leaves api -> auditor and replica -> api live.
      # Only new api -> replica frames are dropped until link_heal runs.
      - kind: link_partition
        network: backplane
        from: api
        to: replica
        after: read_stale
      - kind: link_heal
        network: backplane
        from: api
        to: replica
        after: retry
      # This changes only the simulated drive. The disk bytes and seeded RNG
      # remain in place; later I/O now fails deterministically.
      - kind: storage_fault
        service: replica
        drive: data
        after: write
        error_ppm: 1000000
        torn_write_bytes: 1
      # Restore the replica's declared drive settings after retry. Existing
      # disk bytes and the deterministic I/O stream stay in place.
      - kind: storage_recover
        service: replica
        drive: data
        after: retry
    properties:
      - name: consistent_read
        kind: always
        service: api
        contains: "THES:ASSERT:consistent_read:pass"
      - name: stale_read_is_reachable
        kind: reachable
        service: api
        requires_serial_evidence:
          all:
            - guard:
                service: auditor
                json:
                  fields:
                    /event: ready
                    /service: auditor
            - join:
                endpoints:
                  - pointers: [/request_id, /attempt]
                    json:
                      fields:
                        /event: operation
                        /name: write
                  - service: replica
                    pointers: [/request_id, /attempt]
                    json:
                      fields:
                        /event: replicated
                        /name: write
                  - service: auditor
                    pointers: [/request_id, /attempt]
                    json:
                      fields:
                        /event: audit
                        /name: write_observed
            # The stale assertion is a later retry than the original write.
            - relation:
                left:
                  pointer: /attempt
                  json:
                    fields:
                      /event: assertion
                      /name: consistent_read
                      /passed: false
                right:
                  pointer: /attempt
                  json:
                    fields:
                      /event: operation
                      /name: write
                operator: greater_than
        predicate:
          all:
            - contains: "THES:ASSERT:consistent_read:fail"
            - sequence:
                - json:
                    fields:
                      /event: operation
                      /name: write
                    capture:
                      transaction: /request_id
                - contains: "THES:CHECKPOINT:read_stale"
                - json:
                    fields:
                      /event: assertion
                      /name: consistent_read
                      /passed: false
                    where:
                      - pointer: /attempt
                        greater_than_or_equal: 2
                      - pointer: /reason
                        matches: "^stale$"
                    equals_capture:
                      /request_id: transaction
            - occurs:
                exactly: 1
                predicate:
                  json:
                    fields:
                      /event: assertion
                      /name: consistent_read
                      /passed: false
            - contains: "THES:M:stale"
            - any:
                - matches: "THES:CHECKPOINT:read_(stale|fresh)"
                - contains: "THES:M:stale"
            - none:
                - contains: "THES:ASSERT:panic"
