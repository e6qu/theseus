name: campaign

services:
  api:
    x-theseus:
      manifest: api/theseus.toml
    networks: [backplane]
  replica:
    x-theseus:
      manifest: replica/theseus.toml
    networks: [backplane]
  auditor:
    x-theseus:
      manifest: auditor/theseus.toml
    networks: [backplane]

networks:
  backplane: {}

x-theseus:
  campaign:
    driver: api
    max_runs: 40
    # Explore one candidate and ordered pairs. The run cap still bounds the
    # complete corpus, even if this list grows.
    max_faults_per_run: 2
    operations:
      - name: write
        input: "write\n"
      - name: read_stale
        input: "read_stale\n"
      - name: retry
        input: "retry\n"
    faults:
      # These run after the named operation emits its checkpoint. Every NIC
      # on this named network changes together, so the next operation sees a
      # real topology change rather than a per-service flag.
      - kind: partition
        network: backplane
        after: write
      - kind: heal
        network: backplane
        after: retry
      # Packet conditions are independent from partition state. This drops all
      # new frames after write, then restores each service's declared baseline
      # after retry without resetting traffic evidence or the seeded stream.
      - kind: network_fault
        network: backplane
        after: write
        drop_ppm: 1000000
        latency_rounds: 2
      - kind: network_recover
        network: backplane
        after: retry
      # A directed link fault leaves api -> auditor and replica -> api live.
      # Only new api -> replica frames are dropped until link_heal runs.
      - kind: link_partition
        network: backplane
        from: api
        to: replica
        after: read_stale
      - kind: link_heal
        network: backplane
        from: api
        to: replica
        after: retry
      # This changes only the simulated drive. The disk bytes and seeded RNG
      # remain in place; later I/O now fails deterministically.
      - kind: storage_fault
        service: replica
        drive: data
        after: write
        error_ppm: 1000000
        torn_write_bytes: 1
    properties:
      - name: consistent_read
        kind: always
        service: api
        contains: "THES:ASSERT:consistent_read:pass"
      - name: stale_read_is_reachable
        kind: reachable
        service: api
        contains: "THES:ASSERT:consistent_read:fail"
