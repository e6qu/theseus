# The userspace APIC probe: the no-irqchip configuration, the debug
# kernel (ftrace), and the boot arguments that keep the kernel's local
# APIC alive while sidestepping the hrtimer high-res switch. The
# workload rides the raw UART ports (/dev/port at 0x3f8): the tty
# layer's open handshake is the remaining frontier and the probe's
# assertions only need the UART registers. The console is left off so
# the kernel's stall point cannot re-enter through the /dev/console
# open; the kernel's output rides the COM2 earlyprintk in
# firecracker-debug.log. See docs/design/deterministic-timer-arming.md
# for the frontier map.
version = 1

[runtime]
firecracker = "work/runtime/firecracker"

[guest]
kernel = "work/guest/vmlinux-debug"
initramfs = "work/guest/initramfs.cpio.gz"

[run]
seed = 42
entropy_device = false
vcpu_count = 1
mem_size_mib = 128
timeout_secs = 1500
boot_args = "earlyprintk=serial,0x2f8,keep reboot=k panic=-1 loglevel=8 initcall_debug i8042.nopnp i8042.noaux hung_task_timeout_secs=5 highres=off lapic=notscdeadline pti=off 8250_core.skip_txen_test=1"

[run.virtual_time]
tick_ns = 1000000
exits_per_tick = 10
hold_kernel_timers = true
filter_timer_msrs = true
userspace_apic = true

[[events]]
when = "ready"
data = "32312e35430a" # 21.5C followed by newline
