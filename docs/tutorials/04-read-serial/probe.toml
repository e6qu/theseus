# The userspace APIC probe: the no-irqchip configuration, the debug
# kernel (ftrace), and the boot arguments that keep the kernel's local
# APIC alive while sidestepping the hrtimer high-res switch. The probe
# asserts the workload's completion and the timer deliveries - not the
# hold path's arming assertions. See
# docs/design/deterministic-timer-arming.md for the frontier map.
version = 1

[runtime]
firecracker = "work/runtime/firecracker"

[guest]
kernel = "work/guest/vmlinux-debug"
initramfs = "work/guest/initramfs.cpio.gz"

[run]
seed = 42
entropy_device = false
vcpu_count = 1
mem_size_mib = 128
timeout_secs = 90
# No console=ttyS0: the boot log stays on the COM2 early console (the
# debug log), the data channel stays clean, and the console TX pacing
# leaves the machine stream alone.
boot_args = "earlyprintk=serial,0x2f8,keep reboot=k panic=-1 loglevel=8 initcall_debug i8042.nopnp i8042.noaux hung_task_timeout_secs=5"

[run.virtual_time]
tick_ns = 1000000
exits_per_tick = 10
hold_kernel_timers = true
filter_timer_msrs = true
userspace_apic = true
timer_speed = 20

[[events]]
when = "ready"
data = "32312e35430a" # 21.5C followed by newline
