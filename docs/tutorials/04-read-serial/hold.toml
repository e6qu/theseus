version = 1

[runtime]
firecracker = "work/runtime/firecracker"

[guest]
kernel = "work/guest/vmlinux"
initramfs = "work/guest/initramfs.cpio.gz"

[run]
seed = 42
entropy_device = false # This guest needs only the UART, not a virtio RNG.
vcpu_count = 1
mem_size_mib = 128
timeout_secs = 10
boot_args = "earlyprintk=serial,0x2f8,keep reboot=k panic=-1 loglevel=7"

[run.virtual_time]
tick_ns = 1000000
exits_per_tick = 10
hold_kernel_timers = true # amd64 only; rejected before boot elsewhere.
filter_timer_msrs = true # Stage 1: observe every timer-MSR arming write.
# The userspace APIC probe (`userspace_apic = true`): no in-kernel
# irqchip - the kernel boots against Theseus's local APIC and IOAPIC,
# arms the TSC-deadline timer, and takes ticks at virtual positions.
# Its current frontier: a KVM_EXIT_FAIL_ENTRY (invalid guest state) at
# the delivery - see design/deterministic-timer-arming.md.
# Stage 3 probe context (the flag above): the arming write is
# blocked from the in-kernel LAPIC and each interrupt is delivered at its
# virtual position. The wake/jump/inject chain works end to end; the open
# question is whether the in-kernel APIC surfaces the IRR-asserted vector
# to the guest - see design/deterministic-timer-arming.md.

[[events]]
when = "ready"
data = "32312e35430a" # 21.5C followed by newline

[[checks]]
name = "sensor reading"
kind = "serial_contains"
value = "sensor reading: 21.5C"
