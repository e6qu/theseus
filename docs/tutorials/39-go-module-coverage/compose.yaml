name: go-module-coverage

services:
  classifier:
    x-theseus:
      manifest: service/theseus.toml
      coverage:
        - manifest: service/work/classifier.theseus-coverage.json
          symbols: service/work/symbols
    networks: [test]

networks:
  test: {}

x-theseus:
  campaign:
    driver: classifier
    guidance: unified
    coverage: application_blocks
    max_runs: 3
    max_operations_per_run: 1
    operations:
      - name: classify_even
        shell:
          command: [/usr/local/bin/classifier, '2']
          output_contains: class=even
      - name: classify_seven
        shell:
          command: [/usr/local/bin/classifier, '7']
          output_contains: class=seven
      - name: classify_odd
        shell:
          command: [/usr/local/bin/classifier, '3']
          output_contains: class=odd
    properties:
      - name: dependency_branch_is_reachable
        kind: reachable
        service: classifier
        contains: THES:SHELL:operation:classify_seven:PASS
