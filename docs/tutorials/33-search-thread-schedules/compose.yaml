name: search-thread-schedules

services:
  ledger:
    x-theseus:
      manifest: service/theseus.toml
    networks: [test]

networks:
  test: {}

x-theseus:
  replay_start: ready_checkpoint
  campaign:
    driver: ledger
    max_runs: 123
    max_operations_per_run: 1
    operations:
      - name: deposit_pair
        shell:
          command: [/usr/local/bin/ledger]
          output_json: true
          thread_schedule:
            threads: [0, 1, 2]
            period: 5
            max_switches: 3
    properties:
      - name: lost_update_is_unreachable
        kind: unreachable
        service: ledger
        contains: '"balance":22'
