version = 1

[runtime]
firecracker = "runtime/firecracker"

[guest]
kernel = "guest/vmlinux"
initramfs = "guest/initramfs.cpio.gz"

[run]
seed = 42
vcpu_count = 1
mem_size_mib = 128
timeout_secs = 10

[network]
loopback = false
duplicate_ppm = 1000000
latency_rounds = 1
jitter_rounds = 1
tx_bytes_per_round = 4096

[[checks]]
name = "worker booted"
kind = "serial_contains"
value = "worker ready"
