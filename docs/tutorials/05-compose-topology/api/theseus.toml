version = 1

[runtime]
firecracker = "runtime/firecracker"

[guest]
kernel = "guest/vmlinux"
initramfs = "guest/initramfs.cpio.gz"

[run]
seed = 41
vcpu_count = 1
mem_size_mib = 128
timeout_secs = 10

[network]
loopback = false

[[checks]]
name = "api reached worker"
kind = "serial_contains"
value = "ping passed"
