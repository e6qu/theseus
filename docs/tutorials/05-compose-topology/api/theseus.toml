version = 1

[runtime]
firecracker = "runtime/firecracker"

[guest]
kernel = "guest/vmlinux"
initramfs = "guest/initramfs.cpio.gz"

[run]
seed = 41
vcpu_count = 1
mem_size_mib = 128
timeout_secs = 10

[[events]]
when = "ready"
data = "70696e670a"

[network]
loopback = false
duplicate_ppm = 1000000
latency_rounds = 1
jitter_rounds = 1
tx_bytes_per_round = 4096

[[checks]]
name = "api reached worker"
kind = "serial_contains"
value = "ping passed"

[[checks]]
name = "api accepted UART command"
kind = "serial_contains"
value = "serial command accepted"
