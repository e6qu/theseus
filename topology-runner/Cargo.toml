[package]
name = "theseus-topology-runner"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Linux-only deterministic Theseus Compose topology executor"

[[bin]]
name = "theseus-topology"
path = "src/main.rs"

[dependencies]
addr2line = { version = "0.27.1", default-features = false, features = ["loader"] }
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_json_path = "0.7.2"
sha2 = "0.10.9"
theseus-engine = { path = "../engine" }
theseus-orchestrator = { path = "../orchestrator" }
vmm = { path = "../firecracker/src/vmm" }
