[package]
name = "theseus-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Theseus guest SDK: the control-channel contract, shared by host and guest"

[lib]
path = "lib.rs"

[features]
default = []
std = ["slab", "thiserror", "displaydoc"]

[dependencies]
slab = { version = "0.4.12", optional = true }
thiserror = { version = "2.0.18", optional = true }
displaydoc = { version = "0.2.6", optional = true }
