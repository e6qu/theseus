[package]
name = "theseus-orchestrator"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Theseus orchestrator: timeline branching, coverage, and the exploration engine"

[lib]
path = "src/lib.rs"

[dependencies]
vmm = { path = "../firecracker/src/vmm" }
kvm-ioctls = "0.25.0"
kvm-bindings = { version = "0.14.0", features = ["fam-wrappers", "serde"] }
rand_chacha = { version = "0.9.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
memfd = "0.6.5"
vm-memory = { version = "0.18.0", features = ["backend-mmap", "backend-bitmap"] }
event-manager = "0.4.2"
libc = "0.2.186"
thiserror = "2.0.18"
displaydoc = "0.2.6"

[dev-dependencies]
bitcode = { version = "0.6.9", features = ["serde"] }
vmm-sys-util = "0.15.0"
