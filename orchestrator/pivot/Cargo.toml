[package]
name = "theseus-pivot"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace]

[[bin]]
name = "theseus-pivot"
path = "src/main.rs"

[dependencies]
theseus-sdk = { path = "../../sdk", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
libc = "0.2"

[profile.release]
panic = "abort"
