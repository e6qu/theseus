[package]
name = "theseus-explorer"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Linux+KVM executor for deterministic Theseus exploration"

[[bin]]
name = "theseus-explorer"
path = "src/main.rs"

[dependencies]
event-manager = "0.4.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
theseus-cli = { path = "../cli" }
theseus-orchestrator = { path = "../orchestrator" }
vmm = { path = "../firecracker/src/vmm" }
